<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Header */
        header { background: #0f172a; color: white; padding: 20px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }

        /* Main Content */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex-grow: 1; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .card:hover { border-color: #38bdf8; transform: translateY(-5px); }
        .card h3 { color: #1e293b; margin-top: 10px; }

        /* Footer */
        footer { background: #e2e8f0; padding: 15px; text-align: center; font-size: 14px; color: #64748b; }
        .status { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">JD Billora Admin</div>
    <p>Dashboard</p>
</header>

<div class="container">
    <div class="card" onclick="window.location.href='banner.html'">
        <h3>Banner Ads</h3>
        <p>Manage home screen banners</p>
    </div>
    
    <div class="card" onclick="window.location.href='signup.html'">
        <h3>Add New User</h3>
        <p>Create admin accounts</p>
    </div>
</div>

<footer>
    Status: <span class="status">● Database Connected</span>
</footer>

<script>
    // অ্যাথেন্টিকেশন চেক
    if (!localStorage.getItem("adminLoggedIn")) {
        window.location.href = "index.html"; // লগিন না থাকলে রিডাইরেক্ট
    }

    // লগআউট ফাংশন প্রয়োজনে যোগ করতে পারেন
    function logout() {
        localStorage.removeItem("adminLoggedIn");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
