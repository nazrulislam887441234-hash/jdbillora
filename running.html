<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pedometer</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .card { background: #16213e; padding: 2rem; border-radius: 20px; text-align: center; width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; }
        #stepCount { font-size: 4rem; margin: 10px 0; color: #4ecca3; }
        button { padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; margin: 5px; }
        .start { background: #4ecca3; }
        .clear { background: #e94560; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>আমার পদক্ষেপ</h1>
    <div id="stepCount">0</div>
    <button class="start" onclick="requestPermission()">অনুমতি ও শুরু</button>
    <button class="clear" onclick="clearData()">রিসেট</button>
</div>

<script>
    let steps = parseInt(localStorage.getItem('steps')) || 0;
    document.getElementById('stepCount').innerText = steps;

    function requestPermission() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response == 'granted') {
                        window.addEventListener('devicemotion', trackSteps);
                    }
                })
                .catch(console.error);
        } else {
            // অ্যান্ড্রয়েডের জন্য সরাসরি
            window.addEventListener('devicemotion', trackSteps);
        }
    }

    let lastAcc = 0;
    function trackSteps(event) {
        let acc = event.accelerationIncludingGravity;
        let totalAcc = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        
        // ধাপের সংবেদনশীলতা চেক (এটি সাধারণত ৩-৫ এর মাঝে থাকে)
        if (totalAcc - lastAcc > 8) {
            steps++;
            document.getElementById('stepCount').innerText = steps;
            localStorage.setItem('steps', steps);
        }
        lastAcc = totalAcc;
    }

    function clearData() {
        steps = 0;
        localStorage.setItem('steps', 0);
        document.getElementById('stepCount').innerText = 0;
    }
</script>
</body>
</html>
