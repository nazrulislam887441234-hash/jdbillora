<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Developer Profile - Nazrul Islam</title>
    <style>
        /* পেজ নড়াচড়া বন্ধ করার জন্য স্টাইল */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #0f172a; /* ডার্ক থিম */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dev-container {
            max-width: 450px;
            margin: 0 auto;
            background: #1e293b;
            min-height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
        }

        /* পাসপোর্ট সাইজ চারকোনা ছবি */
        .dev-photo {
            width: 150px;
            height: 180px; /* পাসপোর্ট সাইজ অনুপাত */
            object-fit: cover;
            border: 3px solid #38bdf8;
            border-radius: 10px; /* চারকোনা কিন্তু কোণাগুলো সামান্য রাউন্ড */
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin: 5px 0;
        }

        .title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* বাটন স্টাইল */
        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
            border: none;
        }

        .btn:active { transform: scale(0.96); }

        .btn-mail { background: #ea4335; color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-yt { background: #ff0000; color: white; }
        .btn-fb { background: #1877f2; color: white; }

        .icon { margin-right: 10px; font-size: 18px; }

        .skill-tag {
            display: inline-block;
            background: #334155;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 5px;
            color: #38bdf8;
            border: 1px solid #38bdf8;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="dev-container">
    <img src="https://mathematical-teal-pr4bbtrqs8.edgeone.app/47863.png" alt="Nazrul Islam" class="dev-photo">

    <div class="name">NAZRUL ISLAM</div>
    <div class="title">YouTuber | Graphics Designer | App & Web Developer</div>

    <div style="margin: 15px 0;">
        <span class="skill-tag">Web Developer</span>
        <span class="skill-tag">App Developer</span>
        <span class="skill-tag">Graphics designer</span>
        <span class="skill-tag">contant creator</span>
    </div>

    <div class="btn-box">
        <a href="mailto:nazrulislam887441234@gmail.com" class="btn btn-mail">
            <span class="icon">📧</span> Email Me
        </a>
        
        <a href="https://wa.me/8801316487435" class="btn btn-wa">
            <span class="icon">💬</span> WhatsApp: 01316487435
        </a>

        <a href="https://youtube.com/@amr_technology_nazrul" class="btn btn-yt">
            <span class="icon">📺</span> YouTube Channel
        </a>

        <a href="https://www.facebook.com/amrtechnologynazrul" class="btn btn-fb">
            <span class="icon">📢</span> Facebook Page
        </a>
    </div>

    <div class="footer">
        © 2026 Developed by Nazrul Islam <br>
        All Rights Reserved
    </div>
</div>

</body>
</html>
