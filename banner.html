<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Banner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; text-align: center; margin-bottom: 20px; }
        .preview-box { width: 100%; min-height: 150px; background: #e2e8f0; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        input[type="file"] { margin-bottom: 15px; width: 100%; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-upload { background: #22c55e; color: white; }
        .btn-delete { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>ব্যানার ম্যানেজমেন্ট</h2>
    <div class="preview-box" id="previewArea">ব্যানার নেই</div>
    
    <input type="file" id="imageInput" accept="image/*">
    <button class="btn-upload" onclick="uploadBanner()">আপলোড ও আপডেট</button>
    <button class="btn-delete" onclick="deleteBanner()">পুরানো ব্যানার ডিলিট</button>
</div>

<script>
    // অথ চেক
    if (!localStorage.getItem("adminLoggedIn")) window.location.href = "index.html";

    // ব্যানার দেখানো
    function showBanner() {
        const savedBanner = localStorage.getItem("bannerUrl");
        if (savedBanner) {
            document.getElementById("previewArea").innerHTML = `<img src="${savedBanner}" style="width:100%">`;
        } else {
            document.getElementById("previewArea").innerHTML = "ব্যানার নেই";
        }
    }

    // আপলোড ফাংশন
    async function uploadBanner() {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert("ফাইল সিলেক্ট করুন!");

        const formData = new FormData();
        formData.append('image', file);

        const response = await fetch('https://api.imgbb.com/1/upload?key=cbc05b6d6230ba1ed478e618ec5e7383', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        
        if(data.success) {
            localStorage.setItem("bannerUrl", data.data.url);
            alert("ব্যানার সফলভাবে আপডেট হয়েছে!");
            showBanner();
        }
    }

    // ডিলিট ফাংশন
    function deleteBanner() {
        localStorage.removeItem("bannerUrl");
        document.getElementById("previewArea").innerHTML = "ব্যানার নেই";
        alert("ব্যানার ডিলিট করা হয়েছে!");
    }

    showBanner();
</script>
</body>
</html>
